apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-from-backend
  namespace: pardis-shop
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend-api
    ports:
    - protocol: TCP
      port: 8000
