apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pardis-shop
  namespace: pardis-shop
  annotations:
    kubernetes.io/elb.class: performance
    kubernetes.io/elb.id: fb11e52b-6713-4df3-9c7c-9c80ec00678d
    kubernetes.io/elb.port: '80'
spec:
  ingressClassName: cce
  rules:
  - host: shop.prsp.ir
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
