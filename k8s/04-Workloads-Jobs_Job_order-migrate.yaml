apiVersion: batch/v1
kind: Job
metadata:
  name: order-migrate
  namespace: pardis-shop
  labels:
    app: order-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: order-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: default-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: swr.me-ptp-1.mypardiscloud.com/group_c/pardis-shop-order-service:latest
        command:
        - python
        - -m
        - app.migrate
        envFrom:
        - configMapRef:
            name: shop-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: shop-secrets
              key: ORDER_DATABASE_URL
        - name: INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: shop-secrets
              key: INTERNAL_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
