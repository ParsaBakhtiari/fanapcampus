# Copy to k8s/02-secret.yaml (git-ignored), fill in real values, then:
#   kubectl apply -f k8s/02-secret.yaml
# Each Deployment only mounts the keys it needs (see env: in 20-/21- files).
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: pardis-shop
type: Opaque
stringData:
  # RDS MySQL (private IP or private domain of the RDS instance)
  BACKEND_DATABASE_URL: mysql+pymysql://shop:CHANGE_ME@10.0.3.10:3306/shop_db
  ORDER_DATABASE_URL: mysql+pymysql://orders:CHANGE_ME@10.0.3.10:3306/order_db

  # DCS Redis. No password: redis://10.0.3.20:6379/0
  REDIS_URL: redis://:CHANGE_ME@10.0.3.20:6379/0

  # openssl rand -hex 32   (two different values)
  JWT_SECRET: CHANGE_ME_64_hex_chars________________________________________
  INTERNAL_TOKEN: CHANGE_ME_64_hex_chars________________________________________

  # OBS access key of an IAM user limited to the three ecommerce-* buckets
  OBS_ACCESS_KEY: CHANGE_ME
  OBS_SECRET_KEY: CHANGE_ME

  # First admin account, created by the backend-migrate Job
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: CHANGE_ME_long_password
