apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-api-from-frontend
  namespace: pardis-shop
spec:
  podSelector:
    matchLabels:
      app: backend-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 8000
