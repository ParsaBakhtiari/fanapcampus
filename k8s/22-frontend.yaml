# Frontend: static web UI (nginx) and reverse proxy for /api -> backend-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pardis-shop
  labels: {app: frontend, tier: frontend}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: frontend}
    spec:
      imagePullSecrets: [{name: __PULL_SECRET__}]
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app: frontend}}}
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: frontend}}}
      containers:
        - name: frontend
          image: __REGISTRY__/pardis-shop-frontend:__TAG__
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pardis-shop
  labels: {app: frontend}
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
