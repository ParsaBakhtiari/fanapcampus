# Order Service: orders in order_db, PDF invoices in the OBS invoices bucket.
# Internal only: reachable just from backend-api (see 50-networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: pardis-shop
  labels: {app: order-service, tier: backend}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service, tier: backend}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets: [{name: __PULL_SECRET__}]
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app: order-service}}}
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: order-service}}}
      containers:
        - name: order-service
          image: __REGISTRY__/pardis-shop-order-service:__TAG__
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: shop-config}}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: shop-secrets, key: ORDER_DATABASE_URL}}}
            - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: shop-secrets, key: INTERNAL_TOKEN}}}
            - {name: OBS_ACCESS_KEY, valueFrom: {secretKeyRef: {name: shop-secrets, key: OBS_ACCESS_KEY}}}
            - {name: OBS_SECRET_KEY, valueFrom: {secretKeyRef: {name: shop-secrets, key: OBS_SECRET_KEY}}}
          readinessProbe:
            httpGet: {path: /healthz/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop: {exec: {command: ["python", "-c", "import time; time.sleep(5)"]}}
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {cpu: "1", memory: 320Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: pardis-shop
  labels: {app: order-service}
spec:
  type: ClusterIP
  selector: {app: order-service}
  ports: [{name: http, port: 8000, targetPort: http}]
