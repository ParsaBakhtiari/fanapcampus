apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: pardis-shop
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  CURRENCY: USD
  SHOP_NAME: Pardis Shop
  ORDER_SERVICE_URL: http://order-service:8000
  OBS_ENDPOINT: https://obs.me-ptp-1.mypardiscloud.com
  OBS_REGION: me-ptp-1
  OBS_ADDRESSING_STYLE: virtual
  OBS_SSE: ''
  OBS_BUCKET_IMAGES: groupc-ecommerce-images
  OBS_BUCKET_INVOICES: groupc-ecommerce-invoices
