worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # read-only root filesystem: every writable path lives in /tmp (emptyDir)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","service":"frontend",'
    '"client":"$http_x_forwarded_for","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream_time":"$upstream_response_time","request_id":"$request_id"}';
  access_log /dev/stdout json;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 6m;

  # Frontend -> Backend API (Kubernetes Service "backend-api")
  upstream backend_api {
    server backend-api:8000;
    keepalive 16;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/ {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # No add_header inside locations: it would drop the security headers above.
    location /assets/ {
      expires 1h;
    }

    location / {
      try_files $uri /index.html;
      expires -1;
    }
  }
}
